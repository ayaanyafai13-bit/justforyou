<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Papa ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 🚗 LOADING SCREEN -->
<div class="screen active" id="loading-screen">

  <div class="map-bg"></div>

  <div class="loading-stage">
    <div class="road"></div>

    <div class="car">
      <img src="car.png" class="car-img">
    </div>
  </div>
  <p id="locationText">Starting...</p>
</div>

<!-- 🏠 HOME SCREEN -->
<div class="screen" id="home-screen">
  <div class="bg-text">
    <span>baat ko samajne ki koshish kro</span>
    <span>Papadu</span>
    <span>papadi</span>
    <span>yafai wheels</span>
    <span>silver rate</span>
  </div>

  <h1 class="title">For Papa</h1>

  <div class="gifts">
    <div class="gift" onclick="openGift(0, this)">🎁</div>
    <div class="gift" onclick="openGift(1, this)">🎁</div>
    <div class="gift" onclick="openGift(2, this)">🎁</div>
    <div class="gift" onclick="openGift(3, this)">🎁</div>
  </div>

</div>

<!-- 📜 CONTENT SCREEN -->
<div class="screen" id="content-screen">
  <h2 id="contentTitle"></h2>
  <p id="contentText"></p>

  <!-- IMAGE AREA -->
  <div id="contentImageContainer" class="hidden">
    <img id="contentImage" src="" alt="">
  </div>

  <button onclick="goBack()">⬅ Back</button>
</div>

<script src="script.js"></script>
</body>
</html>
